<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f4f5f7; --paper:#ffffff; --ink:#1b2029; --muted:#5d6675; --line:#dde1e8; --accent:#1f5fbf;
  --blue:#1f5fbf; --red:#c62f2f; --hl-y:#fbf1c4; --hl-b:#e6eefb; --warn:#8a5800; --warn-soft:#fbf1dc;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --paper:#1a2029; --ink:#e6ebf2; --muted:#9aa5b5; --line:#2d3644; --accent:#82b1ff;
  --blue:#82b1ff; --red:#ff8a80; --hl-y:#3a3416; --hl-b:#1b2a42; --warn:#f0c062; --warn-soft:#352a14; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161c; --paper:#1a2029; --ink:#e6ebf2; --muted:#9aa5b5; --line:#2d3644; --accent:#82b1ff;
  --blue:#82b1ff; --red:#ff8a80; --hl-y:#3a3416; --hl-b:#1b2a42; --warn:#f0c062; --warn-soft:#352a14; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;margin:1.4em 0 .5em}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
h4{font-size:.98rem;font-weight:600;color:var(--muted)}
p{margin:.6em 0}
a{color:var(--accent)}
.back{font-size:.9rem;text-decoration:none}
.k{font-size:.85rem;color:var(--muted)}
header .gray,.gray{color:var(--muted);font-size:.9rem}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:.95rem;padding:10px 8px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.tabs button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 18px 18px;min-width:0}
.panel>:first-child{margin-top:14px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.92rem;margin-top:14px}
blockquote{margin:.8em 0;padding:4px 14px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0}
.callout{background:var(--bg);border-radius:8px;padding:6px 14px;margin:.8em 0}
details{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin:.8em 0}
summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px}
details[open]{padding-bottom:8px}
ul,ol{padding-left:1.3em;margin:.5em 0}
li{margin:.2em 0}
hr{border:none;border-top:1px solid var(--line);margin:1.4em 0}
.tbl{overflow-x:auto;margin:.8em 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.6}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-gray{color:var(--muted)}
.bg-yellow{background:var(--hl-y)}.bg-blue{background:var(--hl-b)}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <a class="back" href="progress.html">← 회독 현황</a>
    <span class="k">{{SCHOOL}}</span>
    <h1>{{YEAR}} · {{TOPIC}}</h1>
    {{META}}
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-q" aria-controls="q" aria-selected="true">원문</button>
    <button role="tab" id="t-mine" aria-controls="mine" aria-selected="false">내 답안</button>
    <button role="tab" id="t-ref" aria-controls="ref" aria-selected="false">쌤 자료</button>
  </nav>
  <section class="panel" id="q" role="tabpanel" aria-labelledby="t-q">{{Q}}</section>
  <section class="panel" id="mine" role="tabpanel" aria-labelledby="t-mine" hidden>{{MINE}}</section>
  <section class="panel" id="ref" role="tabpanel" aria-labelledby="t-ref" hidden><p class="warn">풀기 전에는 열지 말 것. 다 쓴 뒤 대조하기.</p>{{REF}}</section>
</div>
<script>
const tabs=[...document.querySelectorAll(".tabs button")];
function show(id,push){tabs.forEach(b=>{const on=b.getAttribute("aria-controls")===id;b.setAttribute("aria-selected",on);document.getElementById(b.getAttribute("aria-controls")).hidden=!on});if(push)history.replaceState(null,"","#"+id)}
tabs.forEach(b=>b.addEventListener("click",()=>{show(b.getAttribute("aria-controls"),true);window.scrollTo({top:0})}));
const h=location.hash.slice(1);if(["q","mine","ref"].includes(h))show(h);
</script>
</body>
</html>
